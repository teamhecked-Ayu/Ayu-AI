[build-system]
requires = ["setuptools>=69.0.0", "wheel>=0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ayu-ai"
version = "0.3.0"
description = "Ayu AI: a terminal-first, local-first AI assistant and AyuLM research foundation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "teamhecked-Ayu" }]
license = { file = "LICENSE" }
dependencies = [
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
training = ["torch>=2.1.0"]
prototype = ["numpy>=1.26.0"]
dev = ["pytest>=8.0.0", "numpy>=1.26.0"]

[project.scripts]
ayu = "ayu.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "docs*", "build*", "dist*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
