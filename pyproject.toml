[build-system]
requires = ["setuptools>=69.0.0", "wheel>=0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ayu-ai"
version = "0.1.0"
description = "AYU AI: a terminal-first, local-first AI operating system for projects, memory, and local model workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "teamhecked-Ayu" }]
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26.0",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
ayu = "ayu.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "docs*", "build*", "dist*"]

[tool.pytest.ini_options]
pythonpath = ["."]
